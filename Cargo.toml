[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["copyleftdev"]
repository = "https://github.com/copyleftdev/murmur"
rust-version = "1.85"

[workspace.dependencies]
murmur-core = { path = "crates/murmur-core", version = "0.1.0" }
murmur-inject = { path = "crates/murmur-inject", version = "0.1.0" }
murmur-audio = { path = "crates/murmur-audio", version = "0.1.0" }
murmur-hotkey = { path = "crates/murmur-hotkey", version = "0.1.0" }
murmur-asr = { path = "crates/murmur-asr", version = "0.1.0" }
murmur-engine = { path = "crates/murmur-engine", version = "0.1.0" }
murmur-hud = { path = "crates/murmur-hud", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Audio, graphics and geometry are float maths over integer counts. These casts
# are the work, not a smell, and silencing them individually would bury the
# lints that do matter.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
