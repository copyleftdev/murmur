[package]
name = "murmur-asr"
description = "Speech to text, behind one trait so the engine can be proven without a model."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["parakeet"]
parakeet = ["dep:parakeet-rs"]
cuda = ["parakeet", "parakeet-rs/cuda", "dep:libloading", "dep:tracing-subscriber"]
tensorrt = ["parakeet-rs/tensorrt"]

[dependencies]
murmur-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parakeet-rs = { version = "0.3", optional = true }
libloading = { version = "0.8", optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
hound = "3"

[lints]
workspace = true
