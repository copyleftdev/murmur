name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ALSA is the only system library either binary links. Everything the
      # overlay's renderer needs is opened at runtime, so it is not needed to
      # build or to run the tests.
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The tests that need the 640 MB model skip themselves when it is absent,
      # so CI exercises everything else without downloading it.
      - run: cargo test --workspace

      # The packaged icon and desktop entry are generated from the source that
      # draws them; this fails if the committed copies have drifted.
      - name: packaged assets are current
        run: cargo test -p murmur-hud icon::tests::the_installed_icon_matches_what_the_code_draws

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      # Building the packages on every change is what stops a release being the
      # first time anyone finds out that packaging is broken.
      - run: ./packaging/build.sh "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          retention-days: 14
